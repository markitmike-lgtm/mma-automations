name = "mma-automations"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Non secret settings. Secrets (HUBSPOT_TOKEN, STRIPE_API_KEY, STRIPE_WEBHOOK_SECRET,
# CLICKUP_TOKEN, RESEND_API_KEY) are added in the Cloudflare
# dashboard under Settings > Variables and Secrets. They are never stored in this repo.
[vars]
OWNER_EMAIL = "michael@markitmike.com"
FROM_EMAIL = "Markit Mike Agency <team@markitmike.com>"
# where client replies go (forwards to the owner inbox)
REPLY_TO = "team@markitmike.com"
CLICKUP_SPACE_ID = "90136156433"
STAGE_AGREEMENT_SENT = "4534780662"
STAGE_SIGNED = "4534780663"
STAGE_WON = "closedwon"
# "true" to auto send the branded "agreement is on its way" email when SignWell sends
SEND_AGREEMENT_EMAIL = "true"
# "true" makes every handler log what it would do without changing anything
DRY_RUN = "false"
CHAMBERLAIN_MODEL = "claude-sonnet-5-5"
BRIEF_CRON = "0 15 * * *"
ANTHROPIC_WORKSPACE_ID = "wrkspc_01WtxQsuYkqVWccfnKkNWfzW"

[triggers]
# every 10 minutes: Crown Fitting bookings. 15:00 UTC (7am Pacific in winter, 8am in summer): intake reminders and the Daily Crown Brief
crons = ["*/10 * * * *", "0 15 * * *"]
