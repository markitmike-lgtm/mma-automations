<!-- wp:html {"metadata":{"name":"Contact form, sends to HubSpot through mma-automations (Nov 2026)"}} -->
<style>.mml-done{padding:8px 0 4px}.mml-done h3{margin:0 0 10px!important;font-size:24px!important;font-weight:900!important;color:#1c1236!important;text-transform:none!important}.mml-done p{margin:0 0 18px!important;font-size:16px;line-height:1.6;color:#4a4363}.mml-err{margin:12px 0 0!important;font-size:14px;font-weight:700;color:#b42318}.mml-hp{position:absolute!important;left:-9999px!important;width:1px;height:1px;overflow:hidden}.mmct-formcard .grunion-field-wrap.bad .grunion-field{border-color:#e5484d!important}.mmct-lead button[disabled]{opacity:.65;cursor:wait}.mml-optin{display:flex!important;gap:10px;align-items:flex-start;margin:0 0 18px!important;font-size:14px;line-height:1.5;color:#4a4363;cursor:pointer}.mml-optin input{margin-top:3px;width:18px;height:18px;flex:none;accent-color:#5D0EA6}</style>
<form class="mmct-lead wp-block-jetpack-contact-form" novalidate>
<div class="grunion-field-wrap"><label class="grunion-field-label" for="mml-name">Name<span class="grunion-label-required">(required)</span></label><input class="grunion-field" id="mml-name" name="name" type="text" autocomplete="name" maxlength="120" required></div>
<div class="grunion-field-wrap"><label class="grunion-field-label" for="mml-email">Email<span class="grunion-label-required">(required)</span></label><input class="grunion-field" id="mml-email" name="email" type="email" autocomplete="email" maxlength="160" required></div>
<div class="grunion-field-wrap"><label class="grunion-field-label" for="mml-company">Company Name<span class="grunion-label-required">(required)</span></label><input class="grunion-field" id="mml-company" name="company" type="text" autocomplete="organization" maxlength="160" required></div>
<div class="grunion-field-wrap"><label class="grunion-field-label" for="mml-phone">Phone<span class="grunion-label-required">(required)</span></label><input class="grunion-field" id="mml-phone" name="phone" type="tel" autocomplete="tel" maxlength="40" required></div>
<div class="grunion-field-wrap"><label class="grunion-field-label" for="mml-message">Message</label><textarea class="grunion-field" id="mml-message" name="message" maxlength="5000" placeholder="Tell us about your project or how we can help crown your brand."></textarea></div>
<label class="mml-optin"><input type="checkbox" name="optin"><span>Yes, send me marketing tips, Crown Blog posts and offers from Markit Mike Agency. Unsubscribe anytime.</span></label>
<input class="mml-hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
<div class="wp-block-jetpack-button"><button class="wp-block-button__link" type="submit">Send My Message</button></div>
<p class="mml-err" role="alert" hidden></p>
</form>
<script>(function(){var f=document.querySelector('form.mmct-lead');if(!f)return;var t0=Date.now(),err=f.querySelector('.mml-err'),btn=f.querySelector('button');
function v(n){return(f.elements[n].value||'').trim();}
f.addEventListener('input',function(e){var w=e.target.closest('.grunion-field-wrap');if(w)w.classList.remove('bad');});
f.addEventListener('submit',function(e){e.preventDefault();err.hidden=true;var bad=null;
['name','email','company','phone'].forEach(function(n){var ok=v(n)&&(n!=='email'||/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v(n)));var w=f.elements[n].closest('.grunion-field-wrap');w.classList.toggle('bad',!ok);if(!ok&&!bad)bad=f.elements[n];});
if(bad){bad.focus();err.textContent='Please fill in the highlighted fields.';err.hidden=false;return;}
btn.disabled=true;btn.textContent='Sending...';
fetch('https://mma-automations.markitmike.workers.dev/lead',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:v('name'),email:v('email'),company:v('company'),phone:v('phone'),message:v('message'),optIn:!!f.elements.optin.checked,src:window.mmaSource?window.mmaSource():null,website:v('website'),page:location.pathname,elapsed:Date.now()-t0})})
.then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error||'error');});})
.then(function(){if(window.mmaTrack)mmaTrack('generate_lead',{form:'contact',email_opt_in:!!f.elements.optin.checked});f.outerHTML='<div class="mml-done" role="status"><h3>Your message has been sent!</h3><p>Thank you. Our team will reply within 24 to 48 hours, and a confirmation is on its way to your inbox. Rather pick a time now?</p><div class="wp-block-jetpack-button"><a class="wp-block-button__link" href="https://markitmike.com/crownfitting/">Book a Crown Fitting &#10140;</a></div></div>';})
.catch(function(x){btn.disabled=false;btn.textContent='Send My Message';err.innerHTML=(x&&x.message&&x.message!=='error'&&x.message.indexOf('fetch')<0?x.message+' ':'')+'Something went wrong sending your message. Please try again, or email <a href="mailto:info@markitmike.com">info@markitmike.com</a> or call (714) 919&#8209;9469.';err.hidden=false;});});})();</script>
<!-- /wp:html -->
